services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: organizational_singularity
      POSTGRES_USER: os_app
      POSTGRES_PASSWORD: os_dev_password
    ports:
      - "5433:5432" # host 5433 to avoid clashing with other local Postgres containers (e.g. maxun-postgres-1)
    volumes:
      - os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os_app -d organizational_singularity"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - os_azurite_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OS_DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=organizational_singularity;Username=os_app;Password=os_dev_password"
      # Azurite's well-known dev-account key -- fine to commit, it's a fixed emulator default,
      # not a real credential (see ADR 0004).
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Storage__ContainerName: "documents"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # "localhost" here would mean this container, not the api container -- server-to-server
      # calls between compose services go through the service name instead. Container-internal
      # port (8080), not the host-mapped one (5080).
      NEXT_PUBLIC_API_BASE_URL: "http://api:8080"
      AUTH_MICROSOFT_ENTRA_ID_ID: "${AUTH_MICROSOFT_ENTRA_ID_ID}"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "${AUTH_MICROSOFT_ENTRA_ID_SECRET}"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "${AUTH_MICROSOFT_ENTRA_ID_ISSUER}"
      ENTRA_API_SCOPE: "${ENTRA_API_SCOPE}"
      AUTH_SECRET: "${AUTH_SECRET}"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  os_postgres_data:
  os_azurite_data:
